<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/addstaff.css">
    <title>Создать сотрудника</title>
</head>
<body class="body">
    <form action="/addstaff" method="post" class="form">
        <label for="name">ФИО</label>
        <input type="text" name="name" id="name">
   <div class="form-group">
                        <label for="phone">
                            <i class="bi bi-telephone"></i> Номер телефона
                        </label>
                        <input type="tel" class="form-control" id="phone" name="phone"
                               placeholder="+7 1488 42 52 67"
                               inputmode="numeric"
                               pattern="[0-9+\-\(\)\s]*"
                               required>
                    </div>

        <label for="profession">Профессия</label>
        <select name="profession" id="profession">
        {%if professions%}
        {%for profession in professions%}
        <option value="{{profession[0]}}">{{profession[1]}}</option>
        {%endfor%}
        {%endif%}
        </select>
        <label for="experience">Опыт работы</label>
        <input type="number" name="experience" id="experience">
        <button class="button">Создать</button>
    </form>
    <form action="/addprofession" method="post" class="form">
        <label for="profession">Профессия</label>
        <input type="text" name="profession" id="profession">
        <button class="button">Создать</button>


    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('phone');
            if (phoneInput) {
                phoneInput.addEventListener('focus', function() {
                    if (!this.value.startsWith('+')) {
                        this.value = '+ ';
                    }
                });
                phoneInput.addEventListener('input', function() {
                    if (this.value.length === 1 && this.value[0] !== '+') {
                        this.value = '+ ' + this.value;
                    }
                });
            }
        });
    </script>

</body>
</html>
